[package]
name = "tests"
description = "test suite for pg_search"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
approx = "0.5.1"
anyhow = "1.0.102"
async-std = { version = "1.13.2", features = ["attributes"] }
bigdecimal = { version = "0.4.10", features = ["serde"] }
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["clock", "alloc"] }
cmd_lib = "1.9.6"
dotenvy = "0.15.7"
futures = "0.3.32"
lockfree-object-pool = "0.1.6"
pgvector = { version = "0.4.1", features = ["sqlx"] }
pretty_assertions = "1.4.1"
rand = "0.9.4"
rstest = "0.25.0"
rustc-hash = "2.1.2"
serde_json = "1.0.149"
soa_derive = "0.14.0"
sqlx = { version = "0.9.0", features = [
  "postgres",
  "runtime-async-std",
  "time",
  "bigdecimal",
  "uuid",
  "chrono",
] }
strum = { version = "0.27.2", features = ["derive"] }
# Not used directly. `sqlx-postgres` depends on whoami with `default-features = false`,
# which on whoami 2.x also drops `std` and silently degrades the backend to the stub that
# reports every user as "anonymous". When `DATABASE_URL` carries no username -- as in CI
# and in tests/README.md -- sqlx falls back to that and connects as a role which does not
# exist. Declaring it here forces `std` back on through feature unification.
whoami = { version = "2.1.2", default-features = false, features = ["std"] }
tantivy.workspace = true
tempfile = "3.27.0"
time = { version = "0.3.47", features = ["serde"] }
tokenizers = { path = "../tokenizers" }
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros"] }
uuid = "1.23.1"
num-traits = "0.2.19"
proptest = "1.11.0"
proptest-derive = "0.6.0"
env_logger = "0.11.10"

[package.metadata.cargo-machete]
# Declared to force whoami's `std` feature on via unification; never referenced in source.
ignored = ["whoami"]
